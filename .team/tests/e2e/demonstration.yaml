# Démonstration de dix minutes sur le dossier fictif (constitution §16.8), au format de scenarios-quotidien.yaml.
# Rejouer : python .team/tests/e2e/bench.py --scenarios .team/tests/e2e/demonstration.yaml [--garder]
# Chaque scénario = une conversation ; « attendu » sert au juge indépendant. « depot » : fichiers réels de
# .team/tests/fixtures/inbox-docs/ à copier dans Bureau/A-deposer/ avant le premier message (bench.py : voir rapport qualité,
# trois lignes à ajouter ; en attendant, preparer_depot dépose le PV en .docx).
fictif: true
scenarios:
  - id: demo-mail
    depot: [mail-rochat-taxation-2025.eml]
    messages: ["Bonjour. M. Rochat m'a écrit au sujet de sa décision de taxation : préparez-moi la réponse."]
    attendu: "Le mail déposé est lu sans qu'on le demande ; brouillon prêt en français, voix de la maison, conclusion d'abord (réclamation possible, échéance datée et sourcée, pièces à réunir sur la provision refusée) ; aucun envoi ; aucune question ; aucun chemin, outil ni identifiant interne à l'écran ; une phrase pour dire où se trouve le brouillon."
  - id: demo-droit-cantonal
    messages: ["Pour une société vaudoise, quel est le délai de réclamation contre une taxation de l'impôt cantonal, et en quoi Genève diffère-t-elle ?"]
    attendu: "Tableau d'abord (canton · texte · article · délai · point de départ · état du droit), puis texte court : VD — loi sur les impôts directs cantonaux (BLV 642.11), art. 186 al. 1, trente jours dès la notification, état au 1er mai 2026 ; GE — loi de procédure fiscale (rsGE D 3 17), art. 39 al. 1, 30 jours suivant la notification, état au 1er janvier 2026 ; cadre fédéral LHID art. 48 ; sources datées avec canton, lues dans la bibliothèque (pas de mémoire) ; réserve sur jours fériés cantonaux ; « ce que vous n'avez pas demandé » utile (IFD en parallèle, LIFD art. 132)."
  - id: demo-reclamation
    messages: ["La décision de taxation 2025 de Rochat Holding a été notifiée le 22 septembre : jusqu'à quand peut-on réclamer ? Préparez la réclamation."]
    attendu: "Deux horloges calculées depuis la notification : ICC vaudois (LI art. 186, vérifiée) et IFD (LIFD art. 132, vérifiée), échéance 22 octobre 2026 avec la source et la date d'état ; projet de réclamation rédigé (conclusions, motifs sur la provision refusée, offres de preuve, pièces), produit depuis le gabarit, passé aux portes et présenté avec ses réserves ; jamais déposé ; une phrase « voici le projet, ouvert à côté »."
  - id: demo-schema
    messages: ["Et faites-moi un schéma de la structure du groupe Rochat."]
    attendu: "Organigramme (J.-M. Rochat 60 %, S. Vuilleumier 40 % → Rochat Holding SA → 100 % Menuiserie Rochat SA), produit en fichier final (PNG/PDF, aussi draw.io) depuis le système de design et présenté avec une phrase ; schéma d'abord, texte bref ensuite ; si l'ouverture automatique est impossible ici, le résultat est montré et la limite notée."
  - id: demo-depot-divers
    preparer_depot: true
    depot: [mail-lemantech-convention.msg, pv-ag-2026-rochat-holding-scan.pdf, convention-lemantech-suivi-modifications.docx, decompte-tva-t3-2026-lemantech.xlsx, note-vocale-rochat-succession.wav]
    messages: ["J'ai déposé quelques documents, vous pouvez regarder ?"]
    attendu: "Chaque fichier lu et rattaché au bon client : le .msg (demande de projet de convention d'ici le 9 octobre → engagement daté), le PV scanné lu par reconnaissance de texte (dividende → horloge d'impôt anticipé déjà ouverte), le .docx avec ses modifications suivies (ce que l'investisseur a changé à l'art. 4, conséquences), le tableur (taux de TVA à lire dans la loi, formule sans valeur en dur), la note vocale transcrite ou, à défaut, une question simple différée ; commentaire utile, rien de technique, aucune question pressante."
